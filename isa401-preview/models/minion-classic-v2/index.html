<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Classic Minion V2 Preview</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #ece8dc;
        color: #1f211d;
        font-family: "Segoe UI", sans-serif;
      }

      canvas {
        display: block;
      }

      .hud {
        position: fixed;
        z-index: 2;
        inset: 22px 24px auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        pointer-events: none;
        font-family: "Cascadia Mono", "Consolas", monospace;
        font-size: 9px;
      }

      .hud strong {
        font-weight: 600;
      }

      .badge {
        padding: 7px 10px;
        border: 1px solid rgba(31, 33, 29, 0.2);
        border-radius: 4px;
        background: rgba(236, 232, 220, 0.78);
        backdrop-filter: blur(12px);
      }

      .foot {
        position: fixed;
        z-index: 2;
        inset: auto 24px 22px;
        display: flex;
        justify-content: space-between;
        gap: 20px;
        color: rgba(31, 33, 29, 0.58);
        font-family: "Cascadia Mono", "Consolas", monospace;
        font-size: 8px;
        pointer-events: none;
      }

      .loading {
        position: fixed;
        inset: 0;
        z-index: 3;
        display: grid;
        place-items: center;
        background: #ece8dc;
        font-family: "Cascadia Mono", "Consolas", monospace;
        font-size: 10px;
        transition: opacity 300ms ease;
      }

      .loading.is-ready {
        opacity: 0;
        pointer-events: none;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div class="loading">LOADING CHARACTER MESH</div>
    <div class="hud">
      <div>
        <strong>POSEBOOK / CLASSIC MINION V2</strong>
      </div>
      <div class="badge">BLENDER 4.5 · TPOSE · VRM READY</div>
    </div>

    <div class="foot">
      <span>DRAG TO ROTATE / SCROLL TO ZOOM</span>
      <span>VRM 1.0 / 19 HUMANOID BONES / REALTIME READY</span>
    </div>

    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
      });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.08;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color("#ece8dc");

      const camera = new THREE.PerspectiveCamera(
        34,
        innerWidth / innerHeight,
        0.01,
        100
      );
      camera.position.set(2.6, 1.8, 4.8);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.07;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.9;
      controls.enablePan = false;

      scene.add(new THREE.HemisphereLight("#fff9ed", "#737b72", 3.5));

      const key = new THREE.DirectionalLight("#fff1d6", 5.5);
      key.position.set(-4, 6, 5);
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      scene.add(key);

      const rim = new THREE.DirectionalLight("#b7cfca", 3.2);
      rim.position.set(4, 3, -4);
      scene.add(rim);

      const floor = new THREE.Mesh(
        new THREE.CircleGeometry(2.3, 72),
        new THREE.ShadowMaterial({ color: "#353730", opacity: 0.13 })
      );
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = -0.03;
      floor.receiveShadow = true;
      scene.add(floor);

      const grid = new THREE.GridHelper(4, 20, "#9b9c92", "#c8c6bb");
      grid.position.y = -0.025;
      grid.material.opacity = 0.25;
      grid.material.transparent = true;
      scene.add(grid);

      const loader = new GLTFLoader();
      const modelUrl =
        new URLSearchParams(location.search).get("model") || "./minion-classic-v2.glb";
      loader.load(
        modelUrl,
        (gltf) => {
          const model = gltf.scene;
          const bounds = new THREE.Box3().setFromObject(model);
          const center = bounds.getCenter(new THREE.Vector3());
          const size = bounds.getSize(new THREE.Vector3());
          const maxSize = Math.max(size.x, size.y, size.z);

          model.position.sub(center);
          model.position.y += size.y / 2;
          model.scale.setScalar(2.7 / Math.max(maxSize, 0.001));

          model.traverse((object) => {
            if (!object.isMesh) return;
            object.castShadow = true;
            object.receiveShadow = true;
            object.material.side = THREE.DoubleSide;
            if (object.material.color) {
              object.material.color.lerp(new THREE.Color("#e8dfcb"), 0.3);
            }
            object.material.needsUpdate = true;
          });

          scene.add(model);
          const target = new THREE.Vector3(0, 1.25, 0);
          controls.target.copy(target);
          camera.lookAt(target);
          camera.position.set(2.35, 1.75, 4.7);
          controls.update();

          document.querySelector(".loading").classList.add("is-ready");
          window.__MODEL_READY__ = true;
          window.__MODEL_SCENE__ = { scene, camera, renderer, controls, model };
        },
        undefined,
        (error) => {
          document.querySelector(".loading").textContent = `LOAD FAILED / ${error.message}`;
        }
      );

      addEventListener("resize", () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });

      function animate() {
        controls.update();
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }

      animate();
    </script>
  </body>
</html>
